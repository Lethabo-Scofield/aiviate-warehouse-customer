kind = "web"
previewPath = "/"
title = "BulkMart Pro"
description = "A wholesale grocery e-commerce platform for supermarkets and bulk buyers. Lets users browse and search real food products from the Open Food Facts API, add items to a cart, check out with address selection via an interactive map, and view their full order history."
version = "1.0.0"
id = "artifacts/warehouse-ecommerce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20961

[services.development]
run = "pnpm --filter @workspace/warehouse-ecommerce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/warehouse-ecommerce", "run", "build" ]
serve = "static"
publicDir = "artifacts/warehouse-ecommerce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20961"
BASE_PATH = "/"
